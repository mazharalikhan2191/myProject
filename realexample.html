<!doctype html>
<html>
  <head>
    <title>Real Example</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>Hello, world!</h1>
    <div class="container">
      <!-- On tables -->
      <table class="table table-hover">
        <tr class="table-primary">
          <th>Id</th>
          <th>Employee Name</th>
          <th>Age</th>
          <!-- <th class="table-danger">Dept</th> -->
          <th>Salary</th>
          <th>Generate Token</th>
          <th>Action</th>
        </tr>
        <tbody id="myTable"></tbody>
      </table>

      <!--Modal-->
      <div class="modal fade" id="empModal">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Update Employee</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <input
                type="text"
                id="empId"
                class="form-control mb-2"
                placeholder="ID"
              />
              <input
                type="text"
                id="empName"
                class="form-control mb-2"
                placeholder="Name"
              />
              <input
                type="number"
                id="empAge"
                class="form-control mb-2"
                placeholder="Age"
              />
              <input
                type="number"
                id="empSalary"
                class="form-control mb-2"
                placeholder="Salary"
              />
            </div>

            <div class="modal-footer">
              <button class="btn btn-success" onclick="updateEmp()">
                Update
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      async function getUsers() {
        try {
          const response = await fetch(
            "https://makfreelancer.com/sayakhi/admin/api/Mobile_Services/home",
          );
          const users = await response.json();
          console.log(users);
        } catch (error) {
          console.error("Error:", error);
        }
      }

      getUsers();

      let emp = [
        { id: 101, name: "Ayesha shaik", age: 20, salary: 19000, status: 1 },
        { id: 102, name: "mak ", age: 21, salary: 39000, status: 1 },
        { id: 103, name: "yaseen shaik", age: 22, salary: 59000, status: 1 },
        { id: 104, name: "israr khan", age: 21, salary: 49000, status: 1 },
        { id: 105, name: "usman shaik", age: 20, salary: 29000, status: 1 },
        { id: 106, name: "mohsin", age: 20, salary: 29000, status: 1 },
      ];

      let myClass = ["success", "info", "warning", "primary"];
      for (let i = 0; i < emp.length; i++) {
        let j = 0;
        let tab = document.getElementById("myTable");
        if (myClass[i]) {
          j = i;
        } else {
          j = i - myClass.length;
        }

        let row = `<tr class="table-${myClass[j]}"><td>${emp[i].id}</td><td>${emp[i].name}</td><td>${emp[i].age}</td><td>${emp[i].salary}</td><td><button class="btn btn-primary" onclick="myfunc('${emp[i].name}')">Click me</button></td><td><button class="btn btn-info" style="margin-right:6px" onclick="myEdit('${emp[i].id}')">Edit</button><button class="btn btn-danger" onclick="myDelete('${emp[i].id}')">Delete</button></td></tr>`;
        if (emp[i].status == 1) {
          tab.innerHTML += row;
        }
      }
      function myfunc(a) {
        generateCoupon(a);
      }

      function createCouponGenerator() {
        let count = 0;

        return function (name) {
          // String Functions
          let coupon = name.split(" ").join("").toUpperCase();

          count++;

          //console.log(Coupon: ${coupon}${count});
          alert(`Coupon: ${coupon}${count}`);
        };
      }

      const generateCoupon = createCouponGenerator();

      //edit
      function myEdit(id) {
        let getUser = emp.filter((e) => e.id == id);
        //alert(JSON.stringify(getUser));

        index = 0;
        document.getElementById("empId").value = getUser[index].id;
        document.getElementById("empName").value = getUser[index].name;
        document.getElementById("empAge").value = getUser[index].age;
        document.getElementById("empSalary").value = getUser[index].salary;

        let modal = new bootstrap.Modal(document.getElementById("empModal"));

        modal.show();
      }

      function updateEmp(id) {
        let employee = emp.find((e) => e.id === 102);

        if (employee) {
          employee.name = document.getElementById("empName").value;
          employee.salary = document.getElementById("empSalary").value;
          employee.age = document.getElementById("empAge").value;
        }
        bootstrap.Modal.getInstance(document.getElementById("empModal")).hide();

        renderTable();
      }
      //UPDATE table
      function renderTable() {
        document.getElementById("myTable").innerHTML = "";

        for (let i = 0; i < emp.length; i++) {
          let j = 0;
          let tab = document.getElementById("myTable");
          if (myClass[i]) {
            j = i;
          } else {
            j = i - myClass.length;
          }

          let row = `<tr class="table-${myClass[j]}"><td>${emp[i].id}</td><td>${emp[i].name}</td><td>${emp[i].age}</td><td>${emp[i].salary}</td><td><button class="btn btn-primary" onclick="myfunc('${emp[i].name}')">Click me</button></td><td><button class="btn btn-info" style="margin-right:6px" onclick="myEdit('${emp[i].id}')">Edit</button><button class="btn btn-danger" onclick="myDelete('${emp[i].id}')">Delete</button></td></tr>`;
          if (emp[i].status == 1) {
            tab.innerHTML += row;
          }
        }
      }
      //delete
      function myDelete(id) {}

      //generateCoupon("john smith");
      //generateCoupon("mazhar ali");
    </script>
  </body>
</html>
